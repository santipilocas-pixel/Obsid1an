
name: Build Obsid1an IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          PROJECT="app/Obsid1an.xcodeproj"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "Obsid1an" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Obsid1an.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

          mkdir -p Payload
          APP=$(find "$RUNNER_TEMP/Obsid1an.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "App not found in archive"
            exit 1
          fi

          cp -R "$APP" Payload/
          zip -r Obsid1an.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Obsid1an-IPA
          path: Obsid1an.ipa
          if-no-files-found: error
